name: Build TV APKs

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle failure tail"
            tail -n 150 gradle-build.log
            echo "::endgroup::"
            # Surface compiler/resource errors as check-run annotations so they are
            # visible from the Checks API without downloading the raw logs.
            grep -E '^e: |error: |FAILURE: |Caused by: |Execution failed for task|AAPT: |what went wrong' -i gradle-build.log \
              | head -n 40 \
              | sed 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 200 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-tv-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-debug-${{ github.sha }}
          path: gradle-build.log

  release:
    name: Assemble signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare release keystore from secrets
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
        run: |
          if [ -z "$TV_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret TV_KEYSTORE_BASE64 is not set; building an UNSIGNED release APK. See docs/RELEASE_SIGNING.md"
            exit 0
          fi
          echo "$TV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "TV_KEYSTORE_FILE=$RUNNER_TEMP/release.p12"
            echo "TV_KEYSTORE_PASSWORD=$TV_KEYSTORE_PASSWORD"
            echo "TV_KEY_ALIAS=$TV_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle failure tail"
            tail -n 150 gradle-build.log
            echo "::endgroup::"
            grep -E '^e: |error: |FAILURE: |Caused by: |Execution failed for task|AAPT: |what went wrong' -i gradle-build.log \
              | head -n 40 \
              | sed 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 200 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" || \
            echo "::warning::APK is not signed (repository secrets missing?)"

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-tv-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-release-${{ github.sha }}
          path: gradle-build.log
